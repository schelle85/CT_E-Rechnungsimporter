name: invoice-importer
x-api: &api
  image: invoice-importer-api:ap01-cde
  build:
    context: ..
    dockerfile: backend/Dockerfile
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &db-env
    DB_HOST: db
    DB_NAME: importer
    DB_USER: importer
    DB_PASSWORD_FILE: /run/secrets/db_password
  secrets: [db_password]
  networks: [database]
services:
  db:
    image: mariadb:12.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: importer
      MARIADB_USER: importer
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - type: bind
        source: ${DB_DATA_DIR:-/var/lib/ct-e-rechnungsimporter/mariadb}
        target: /var/lib/mysql
        bind: {create_host_path: false}
    networks: [database]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *api
    restart: unless-stopped
    networks: [database, web]
    environment:
      <<: *db-env
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the external HTTPS origin}
      LDAP_CA_FILE: /run/importer/ldap-ca.pem
      LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      CONFIG_KEY_FILE: /run/secrets/config_key
      LDAP_BOOTSTRAP_FILE: /run/importer/ldap-bootstrap.json
    secrets: [db_password, ldap_bind_password, config_key]
    volumes:
      - type: bind
        source: ${LDAP_CA_HOST_FILE:-/etc/ct-e-rechnungsimporter/pki/ldap-ca.pem}
        target: /run/importer/ldap-ca.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${LDAP_BOOTSTRAP_HOST_FILE:-/etc/ct-e-rechnungsimporter/ldap-bootstrap.json}
        target: /run/importer/ldap-bootstrap.json
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
  nginx:
    image: invoice-importer-web:ap01-cde
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    user: "10002:10002"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${SITE_BIND_IP:-127.0.0.1}:443:8443"
      - "${SITE_BIND_IP:-127.0.0.1}:80:8080"
    volumes:
      - type: bind
        source: ${TLS_DIR:-/etc/ct-e-rechnungsimporter/tls}
        target: /etc/importer-tls
        read_only: true
        bind: {create_host_path: false}
    networks: [web]
    depends_on:
      api: {condition: service_healthy}
networks:
  database: {internal: true}
  web: {internal: false}
secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:-/etc/ct-e-rechnungsimporter/secrets/db_password}
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:-/etc/ct-e-rechnungsimporter/secrets/db_root_password}
  ldap_bind_password:
    file: ${LDAP_BIND_PASSWORD_HOST_FILE:-/etc/ct-e-rechnungsimporter/secrets/ldap-bind-password}
  config_key:
    file: ${CONFIG_KEY_HOST_FILE:-/etc/ct-e-rechnungsimporter/secrets/config-key}
